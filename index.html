<style>

<script>
(function(){'use strict';
/* ===== CONFIG ===== */
const API_URL='https://script.google.com/macros/s/AKfycbzGhNsJlYHCXvx1_Xe1Jr9-VB9nwsPvxEyNba5XVUQVUVjSFOCvzXbBPeEeQGm1kUFTyw/exec';
const API_TOKEN='CAMBIA_ESTE_TOKEN'; // debe coincidir con el token validado en Apps Script
const PAGE=24;
const ESTADOS=['Asignado','En reparación','Almacenado','Prestado','Dado de baja'];
const CAT={
 Tipo:['iPad','iPhone','Android','All in One','Servidor','Laptop','Mac','Router Telmex','Router Total Play','Pulsera POPL'],
 Estado:ESTADOS,
 Marca:['Acer','Apple','Asus','Dell','Honor','HP','Lenovo','Mac','Motorola','Oppo','Otra','POPL','Samsung','Vivo','Xiaomi'],
 Proveedor:['AT&T','No aplica','Otro','Telcel','Virgin Mobile'],
 Color:['Azul','Blanco','Gris espacial','Morado','Negro','Oro','Plateado','Rojo','Verde','No aplica'],
 Capacidad:['32 GB','64 GB','128 GB','256 GB','500 GB','512 GB','1 TB','2 TB','Otro','No aplica'],
 SO:['Android','iOS','iPadOS','Linux','macOS Sonoma','macOS Sequoia','macOS Tahoe','Windows 10','Windows 11 Home','Windows 11 Pro','Otro','No aplica'],
 Area:['Administración','Asistente Dirección','Dirección de Marketing','Dirección Finanzas','Dirección General','Dirección Operaciones','Diseño Digital','Eventos y Congresos','IT','Mercadotecnia','RH','Ventas'],
 Ubicacion:['Aguascalientes','Baja California','Baja California Sur','Campeche','CDMX','Chiapas','Chihuahua','Coahuila','Colima','Durango','Guanajuato','Guerrero','Hidalgo','Jalisco','Estado de México','Michoacán de Ocampo','Morelos','Nayarit','Nuevo León','Oaxaca','Puebla','Querétaro','Quintana Roo','San Luis Potosí','Sinaloa','Sonora','Tabasco','Tamaulipas','Tlaxcala','Veracruz','Yucatán','Zacatecas']};
// [clave formulario, columna hoja, etiqueta, tipo: catálogo | date | ta | (texto)]
const F=[['tipoDispositivo','Tipo','Tipo de dispositivo','Tipo'],['estado','Estado','Estado','Estado'],['fechaAsignacion','FechaAsignacion','Fecha de asignación','date'],['fechaBaja','FechaBaja','Fecha de baja','date'],
['marca','Marca','Marca','Marca'],['modelo','Modelo','Modelo'],['numSerie','NumSerie','Número de serie'],['imei','IMEI','IMEI'],['numeroCelular','NumeroCelular','Número celular'],
['proveedor','Proveedor','Proveedor','Proveedor'],['color','Color','Color','Color'],['capacidad','Capacidad','Capacidad','Capacidad'],['sistemaOperativo','SistemaOperativo','Sistema operativo','SO'],
['direccionMAC','DireccionMAC','Dirección MAC'],['direccionIP','DireccionIP','Dirección IP'],['udid','UDID','UDID'],['usuarioAsignado','UsuarioAsignado','Usuario asignado'],['emailCloud','EmailCloud','Email / ID Cloud'],
['area','Area','Área','Area'],['ubicacion','Ubicacion','Ubicación','Ubicacion'],['observaciones','Observaciones','Observaciones','ta']];
const IM={numeroCelular:'tel',emailCloud:'email',direccionIP:'decimal'},NOCAP=['direccionMAC','udid','emailCloud'];
const SIEMPRE=['tipoDispositivo','estado','marca','modelo','numSerie','proveedor','color','capacidad','sistemaOperativo','area','ubicacion'];
const RED=['Laptop','Mac','All in One','Servidor','Router Telmex','Router Total Play'];
const REQ_TIPO={imei:['iPhone','Android','iPad'],numeroCelular:['iPhone','Android'],udid:['iPad','iPhone','Mac'],direccionMAC:RED,direccionIP:RED};
const UNICOS=['numSerie','imei','direccionMAC','udid'];
const luhn=s=>{let t=0;[...s].reverse().forEach((c,i)=>{let n=+c;if(i%2){n*=2;if(n>9)n-=9}t+=n});return t%10===0};
const FMT={imei:v=>/^\d{15}$/.test(v)&&luhn(v)||'IMEI de 15 dígitos válido',numeroCelular:v=>/^\d{10}$/.test(v.replace(/\D/g,''))||'Debe tener 10 dígitos',
direccionMAC:v=>/^([0-9A-F]{2}[:-]){5}[0-9A-F]{2}$/i.test(v)||'Formato 00:1A:2B:3C:4D:5E',direccionIP:v=>/^((25[0-5]|2[0-4]\d|1?\d?\d)\.){3}(25[0-5]|2[0-4]\d|1?\d?\d)$/.test(v)||'IP inválida',emailCloud:v=>/^\S+@\S+\.\S+$/.test(v)||'Correo inválido'};
const BUSCA=['Folio','Tipo','Marca','Modelo','UsuarioAsignado','NumSerie','UDID','Area','Ubicacion','EmailCloud','IMEI','NumeroCelular','Proveedor'];
const FILT=[['fTipo','Tipo'],['fEstado','Estado'],['fMarca','Marca'],['fArea','Area'],['fUbic','Ubicacion']];
const SC={'Asignado':'a','En reparación':'r','Almacenado':'m','Prestado':'p','Dado de baja':'b'};
const COL=['#0066ff','#00a3ff','#00d4ff','#7c5cff','#00c896','#ffb020','#ff3d5c','#14b8a6','#f97316','#94a3b8'];
const KC=[[0,163,255],[255,61,92],[255,176,32],[124,92,255],[107,114,128]];

/* ===== UTILIDADES ===== */
const $=id=>document.getElementById(id);
const esc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=(a,first)=>'<option value="">'+esc(first)+'</option>'+a.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const hoy=()=>ymd(new Date());
function nf(f){if(!f)return'';const s=String(f).trim();let m;if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;
 if(m=s.match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{2,4})$/)){let y=m[3];if(y.length===2)y='20'+y;return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
 const d=new Date(s);return isNaN(d)?'':ymd(d)}
const folioDe=d=>d.Folio||d.folio||'';
let todos=[],filtrados=[],visibles=PAGE,hash='',syncing=false,editando=null,editVer='',notif=false,tplTab='a',tplDev=null;
const buscar=id=>todos.find(d=>folioDe(d)===id);
function toast(m,t){const e=$('toast');e.textContent=m;e.className='toast t-'+(t||'info')+' show';clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),3200)}
function conn(s){$('cb').className='cbg'+(s==='offline'?' off':s==='syncing'?' syn':'');$('ct').textContent=s==='offline'?'Sin conexión':s==='syncing'?'Sincronizando...':'Conectado'}
function notificar(t,b){if(!notif||!('Notification' in window)||Notification.permission!=='granted')return;try{new Notification(t,{body:b,icon:'icon-192.png'})}catch(e){}}
const lib=u=>new Promise((r,j)=>{const s=document.createElement('script');s.src=u;s.onload=r;s.onerror=()=>j(new Error('No se pudo cargar '+u));document.head.appendChild(s)});
let pdfLib;const cargarPdf=()=>pdfLib||(pdfLib=lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js').then(()=>lib('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.1/jspdf.plugin.autotable.min.js')));

/* ===== API (token + timeout + reintento) ===== */
async function api(body,get){const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),20000);
 try{const r=await fetch(get?API_URL+'?action=list&token='+encodeURIComponent(API_TOKEN)+'&t='+Date.now():API_URL,
  get?{redirect:'follow',signal:ctl.signal}:{method:'POST',redirect:'follow',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({},body,{token:API_TOKEN})),signal:ctl.signal});
  if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(!j.ok)throw new Error(j.error||'Error desconocido');return j.data}
 catch(e){throw new Error(e.name==='AbortError'?'Tiempo de espera agotado':e.message)}finally{clearTimeout(t)}}
const apiGet=async()=>{try{return await api(0,1)}catch(e){return await api(0,1)}};

/* ===== FORMULARIOS (generados desde F y CAT) ===== */
function requeridos(v){const r=new Set(SIEMPRE);for(const k in REQ_TIPO)if(REQ_TIPO[k].includes(v.tipoDispositivo))r.add(k);
 if(['Asignado','Prestado'].includes(v.estado)){r.add('usuarioAsignado');r.add('emailCloud')}
 if(['En reparación','Dado de baja'].includes(v.estado))r.add('observaciones');
 if(v.estado==='Asignado')r.add('fechaAsignacion');if(v.estado==='Dado de baja')r.add('fechaBaja');return r}
function leer(p){const o={};F.forEach(([k])=>o[k]=($(p+k).value||'').trim());if(o.estado!=='Asignado')o.fechaAsignacion='';if(o.estado!=='Dado de baja')o.fechaBaja='';return o}
function cond(p,auto){const e=$(p+'estado').value;$(p+'fechaAsignacionG').hidden=e!=='Asignado';$(p+'fechaBajaG').hidden=e!=='Dado de baja';
